services:
  - type: web
    name: steam-koshel
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: STEAM_API_KEY
        sync: false
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: MAX_DETAILS
        value: "40"
      - key: ALLOWED_ORIGINS
        value: "*"
